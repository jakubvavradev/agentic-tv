<!doctype html>
<html lang="cs" class="boot">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domů</title>
<style>
@font-face{font-family:Clock;font-weight:100 1000;font-stretch:25% 151%;font-display:block;src:url(fonts/robotoflex-digits.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:100 900;font-display:block;src:url(fonts/inter-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Inter;font-weight:100 900;font-display:block;src:url(fonts/inter-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+20A0-20C0,U+2C60-2C7F,U+A720-A7FF}
:root{--spring:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.3,.7,.2,1);--blur:none;--clear:none;--wall:none;--dim:0;
  font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01","tnum"}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;-webkit-font-smoothing:antialiased;cursor:none}

/* wallpaper layers: bg (sky + far range) -> clock -> fg (near peak) = iOS depth effect */
.layer{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;transition:opacity 6s var(--ease)}
.bg{z-index:0}.fg{z-index:2;pointer-events:none}
.layer.off{opacity:0}

/* ---------- Liquid Glass (Apple HIG, materials) ----------
   No backdrop-filter (too slow on a Mali-G31): each panel shows a pre-blurred copy of the wallpaper aligned to the screen,
   so it has no colour of its own and takes it from what is behind. Two HIG variants:
   .clear   – floats over media (dock, buttons): light blur, very translucent, dimmed ~20 % only over bright wallpapers
   .regular – carries text (all-apps panel): heavy blur, luminosity pulled down for legibility
   Shared: specular rim (light caught top-left / bottom-right) + inner edge glow = lensing at the thick edge. */
.glass{position:relative;isolation:isolate;background-repeat:no-repeat;background-size:100% 100%,100% 100%,100vw 100vh;
  box-shadow:inset 0 0 2.4vh rgba(255,255,255,.12),inset 0 .5vh 1vh -.4vh rgba(255,255,255,.35),0 2.4vh 6vh rgba(0,0,0,.28),0 .3vh .8vh rgba(0,0,0,.12)}
.glass.clear{background-image:linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,var(--dim))),
  radial-gradient(120% 160% at 50% -30%,rgba(255,255,255,.20),rgba(255,255,255,.03) 55%,rgba(255,255,255,0)),var(--clear)}
.glass.regular{background-image:linear-gradient(rgba(16,20,28,.38),rgba(16,20,28,.46)),
  radial-gradient(120% 140% at 50% -20%,rgba(255,255,255,.16),rgba(255,255,255,.02) 50%,rgba(255,255,255,0)),var(--blur)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:.16vh;pointer-events:none;z-index:3;
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.18) 22%,rgba(255,255,255,.06) 50%,rgba(255,255,255,.18) 78%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

#date{position:fixed;z-index:3;top:4.6vh;left:0;right:0;text-align:center;font-size:3vh;font-weight:600;letter-spacing:.01em;
  text-shadow:0 .2vh 1.5vh rgba(0,0,0,.25);opacity:.92}

/* clock: clear glass digits = the wallpaper behind them, lens-magnified and brightened; the SVG filter #lgText adds
   a specular bevel and a bright rim. Static between minutes, so the filter is rasterised once a minute. */
#clock{position:fixed;z-index:1;left:0;right:0;top:9.6vh;text-align:center;font-weight:700;font-size:29vh;line-height:1;letter-spacing:-.035em;
  transform:scaleY(1.22);transform-origin:50% 0;color:transparent;
  background-image:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.18)),var(--wall);
  background-size:100% 100%,108vw 108vh;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;
  filter:url(#lgText) drop-shadow(0 .5vh 2.2vh rgba(0,0,0,.28))}

/* Movable analog clock displayed above the foreground scene. */
#towerClock{position:fixed;z-index:3;left:72vw;top:26vh;width:5vh;height:5vh;transform:translate(-50%,-50%);pointer-events:none;display:none;
 filter:drop-shadow(0 .2vh .5vh rgba(0,0,0,.65))}
#towerClock svg{width:100%;height:100%;display:block}
#clockLayoutHint{display:none;position:fixed;z-index:10;left:50%;bottom:19vh;transform:translateX(-50%);padding:1.4vh 2.5vh;border-radius:2vh;
 background:rgba(14,18,26,.92);font-size:2.1vh;white-space:nowrap;color:white}
body.clock-layout #clockLayoutHint{display:block}
/* ---------- tvOS-style home: rows of five across the full width ----------
   Row 0 sits on a full-width Liquid Glass shelf over the wallpaper; the next row peeks in at the bottom edge.
   Moving down slides the whole stack up (one transform), the wallpaper turns into blurred glass behind it. */
:root{--mx:5.2vw;--gx:2.2vw;--col:calc((100vw - 2 * var(--mx) - 4 * var(--gx)) / 5);--th:calc(var(--col) * .6);--rowh:calc(var(--th) + 7.4vh)}
#rows{position:fixed;z-index:5;left:0;right:0;top:64vh;transition:transform .6s var(--spring);will-change:transform}
.row{position:relative;display:flex;gap:var(--gx);padding:2.6vh var(--mx) 0;height:var(--rowh)}
#shelf{position:absolute;left:1.8vw;right:1.8vw;top:0;height:calc(var(--th) + 5.2vh);border-radius:4.2vh;transition:opacity .45s var(--ease);will-change:opacity}
.cell{position:relative;width:var(--col);flex:none}
.tile{position:relative;width:100%;height:var(--th);border-radius:calc(var(--th) * .13);overflow:hidden;background:#1c1f26;
  transition:transform .32s var(--spring),box-shadow .32s var(--ease);box-shadow:0 .6vh 1.6vh rgba(0,0,0,.3)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9;transition:opacity .32s}
.cell.focus .tile img{opacity:1}
/* tvOS 26 icon glass: specular top edge + hairline rim; a light sweep crosses the icon when it takes focus */
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 40%);box-shadow:inset 0 0 0 .12vh rgba(255,255,255,.2),inset 0 .2vh .4vh rgba(255,255,255,.22)}
.tile::after{content:"";position:absolute;inset:-30%;z-index:1;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.36) 50%,transparent 62%);
  transform:translateX(-120%);transition:transform .8s var(--ease)}
.cell.focus .tile{transform:translateY(-1.2vh) scale(1.12);z-index:2;box-shadow:0 3.4vh 5.4vh rgba(0,0,0,.5),0 1vh 2vh rgba(0,0,0,.3)}
.cell.focus .tile::after{transform:translateX(120%)}
.cell.focus{z-index:2}
.cap{position:absolute;left:-10%;right:-10%;top:calc(var(--th) + 2.4vh);text-align:center;font-size:2.7vh;font-weight:600;letter-spacing:.01em;
  color:#fff;text-shadow:0 .2vh 1.2vh rgba(0,0,0,.45);opacity:0;transform:translateY(-.6vh);transition:opacity .2s,transform .3s var(--spring);white-space:nowrap}
.cell.focus .cap{opacity:1;transform:none}
body:not(.grid) .row:not(:first-child) .tile img{opacity:.78}
/* top corners: preferences (left) and system settings (right), round Clear-glass buttons reached with Up */
.topbtn{position:fixed;z-index:5;top:4vh;width:7.4vh;height:7.4vh;border-radius:50%;display:grid;place-items:center;
  transition:transform .3s var(--spring),opacity .4s}
#gear{right:4vw}#opts{left:4vw}
.topbtn svg{width:3.6vh;height:3.6vh;fill:#fff;filter:drop-shadow(0 .2vh .6vh rgba(0,0,0,.3))}
.topbtn.focus{transform:scale(1.2)}
.topbtn .cap{top:auto;bottom:-4.6vh;left:-8vh;right:-8vh}
.topbtn.focus .cap{opacity:1;transform:none}
#opts.dot::after{content:"";position:absolute;top:.6vh;right:.6vh;width:1.5vh;height:1.5vh;border-radius:50%;background:#ff453a;box-shadow:0 0 0 .3vh rgba(0,0,0,.25);z-index:4}
/* preferences sheet: language, dock preset, units, effects, updates. Opens by itself on first start. */
#panel{position:fixed;inset:0;z-index:8;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.sheet{width:min(62vw,118vh);padding:4.6vh 4.6vh 3vh;border-radius:4.4vh;background:rgba(18,22,30,.46);transform:scale(.97);transition:transform .5s var(--spring);
  box-shadow:inset 0 0 0 .12vh rgba(255,255,255,.22),inset 0 .3vh .6vh rgba(255,255,255,.14),0 3vh 8vh rgba(0,0,0,.4)}
.sheet h1{font-size:4.6vh;font-weight:700;letter-spacing:-.02em;padding:0 2.6vh}
#pSub{font-size:2.4vh;font-weight:500;opacity:.7;margin:.6vh 0 2.6vh;padding:0 2.6vh;min-height:2.6vh}
.prow{display:flex;justify-content:space-between;align-items:center;gap:3vh;height:6.8vh;padding:0 2.6vh;border-radius:1.8vh;font-size:2.7vh;font-weight:600;
  transition:background .2s,color .2s,transform .3s var(--spring)}
.prow .v{opacity:.72;display:flex;gap:1.2vh;align-items:center;white-space:nowrap}
.prow .ar{opacity:0;font-weight:400}
.prow.focus{background:rgba(255,255,255,.94);color:#14161b;transform:scale(1.02)}
.prow.focus .v{opacity:1}.prow.focus .ar{opacity:.5}
.prow.btn{justify-content:center;margin-top:1.4vh}
#pFoot{margin-top:2.2vh;text-align:center;font-size:2vh;opacity:.5;font-weight:500}
body.panel #panel{opacity:1;pointer-events:auto}body.panel .sheet{transform:none}
body.panel #veil{opacity:1}
body.panel #rows,body.panel .topbtn{opacity:0}
/* edit mode: icons wiggle, the picked one rides on top */
@keyframes wig{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
body.edit .cell:not(.focus) .tile{animation:wig .32s ease-in-out infinite}
body.edit .cell:nth-child(2n):not(.focus) .tile{animation-delay:-.16s}
body.edit .cell.focus .tile{transform:translateY(-2.2vh) scale(1.18);box-shadow:0 4.4vh 6vh rgba(0,0,0,.55),0 1.2vh 2.4vh rgba(0,0,0,.3)}
/* grid view: wallpaper becomes blurred glass, clock and date slide away with the stack */
#veil{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;will-change:opacity;transition:opacity .5s var(--ease);
  background:linear-gradient(rgba(8,10,16,.34),rgba(8,10,16,.55)),var(--blur) center/cover}   /* covers clock + date too: nothing else repaints */
body.grid #veil{opacity:1}
body.grid .topbtn{opacity:0}
body.grid #shelf{opacity:0}
/* WebGL Liquid Glass active (lglass.js): shader output replaces the CSS approximation */
.gl .glass{background:none!important;box-shadow:none!important}.gl .glass::before{display:none}
.gl #clock{visibility:hidden}
/* ---------- weather in the scene (Open-Meteo for the TV's location): overcast tint, fog at the mountain foot, rain / snow in front.
   Only transform/opacity animate, so it stays on the compositor; WebView pauses it while an app is in front. */
#sky{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 4s var(--ease);
  background:linear-gradient(180deg,rgba(62,70,84,.55),rgba(52,58,70,.32) 45%,rgba(30,34,42,.18))}
#fog{position:fixed;left:-50vw;width:200vw;top:44vh;height:46vh;z-index:2;pointer-events:none;opacity:0;transition:opacity 5s var(--ease);
  background:radial-gradient(28% 40% at 20% 55%,rgba(225,230,238,.55),transparent 70%),radial-gradient(30% 36% at 55% 60%,rgba(225,230,238,.5),transparent 70%),
    radial-gradient(26% 42% at 85% 50%,rgba(225,230,238,.5),transparent 70%);animation:drift 140s linear infinite alternate}
@keyframes drift{to{transform:translateX(30vw)}}
.fall{position:fixed;left:-10vw;width:120vw;top:-50vh;height:150vh;z-index:3;pointer-events:none;opacity:0;transition:opacity 3s var(--ease);
  background-repeat:repeat;will-change:transform}
@keyframes fall{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),50vh,0)}}
.fall.on{opacity:var(--o)}
body.sky #sky{opacity:var(--sky)}body.fog #fog{opacity:var(--fog)}
/* boot: until the WebGL glass has painted, only the wallpaper shows (no CSS fallback look flashing first) */
#rows,#date,#clockCv{transition:opacity .45s var(--ease)}
html.boot #rows,html.boot .topbtn,html.boot #date,html.boot #clockCv,html.boot #clock{opacity:0}
/* ---------- voice: a glass capsule under the date while listening, live transcript, then what it does ---------- */
#voice{position:fixed;z-index:7;left:50%;top:11vh;min-width:34vw;max-width:70vw;padding:1.8vh 3.2vh 1.8vh 2.4vh;border-radius:99vh;display:flex;align-items:center;gap:2vh;
  background:rgba(22,26,34,.62);box-shadow:inset 0 0 0 .12vh rgba(255,255,255,.28),inset 0 .25vh .5vh rgba(255,255,255,.18),0 2.4vh 6vh rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,-2vh) scale(.96);transition:opacity .25s var(--ease),transform .45s var(--spring);pointer-events:none}
body.voice #voice{opacity:1;transform:translate(-50%,0)}
#voice .mic{flex:none;width:5.6vh;height:5.6vh;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#4f8cff,#9a5cff 55%,#ff5c8a)}
#voice .mic svg{width:2.8vh;height:2.8vh;fill:#fff}
body.listening #voice .mic{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1.2vh rgba(120,140,255,.18)}}
#voice .txt{font-size:3vh;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#voice .txt.dim{color:rgba(255,255,255,.6);font-weight:500}
</style>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- liquid-glass bevel for the clock digits: specular light on a blurred height field + bright rim + soft lower glow -->
  <filter id="lgText" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
    <feColorMatrix in="SourceGraphic" type="saturate" values="1.35" result="src"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="h"/>
    <feSpecularLighting in="h" surfaceScale="5" specularConstant="1.05" specularExponent="26" lighting-color="#fff" result="spec">
      <feDistantLight azimuth="225" elevation="48"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feMorphology in="SourceAlpha" operator="erode" radius="1.1" result="er"/>
    <feComposite in="SourceAlpha" in2="er" operator="out" result="rimA"/>
    <feFlood flood-color="#fff" flood-opacity=".75"/>
    <feComposite in2="rimA" operator="in" result="rim"/>
    <feOffset in="SourceAlpha" dy="-2.5" result="off"/>
    <feGaussianBlur in="off" stdDeviation="2.4" result="offB"/>
    <feComposite in="SourceAlpha" in2="offB" operator="out" result="lowA"/>
    <feFlood flood-color="#fff" flood-opacity=".35"/>
    <feComposite in2="lowA" operator="in" result="low"/>
    <feBlend in="specIn" in2="src" mode="screen" result="lit"/>
    <feMerge><feMergeNode in="lit"/><feMergeNode in="low"/><feMergeNode in="rim"/></feMerge>
  </filter>
</svg>
<img class="layer bg" id="bgA"><img class="layer bg off" id="bgB">
<div id="clock"></div><canvas id="clockCv"></canvas>
<div id="towerClock"></div><div id="clockLayoutHint"></div>
<img class="layer fg" id="fgA"><img class="layer fg off" id="fgB">
<div id="sky"></div><div id="fog"></div><div class="fall" id="fall1"></div><div class="fall" id="fall2"></div>
<div id="date"></div>
<div id="veil"></div>
<div id="opts" class="glass clear topbtn"><svg viewBox="0 0 24 24"><path d="M4 7h9.2a2.8 2.8 0 0 1 5.6 0H20v2h-1.2a2.8 2.8 0 0 1-5.6 0H4zm0 8h1.2a2.8 2.8 0 0 1 5.6 0H20v2h-9.2a2.8 2.8 0 0 1-5.6 0H4z"/></svg><div class="cap"></div></div>
<div id="gear" class="glass clear topbtn"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><div class="cap"></div></div>
<div id="rows"></div>
<div id="panel"><div class="sheet"><h1 id="pTitle"></h1><div id="pSub"></div><div id="pRows"></div><div id="pFoot"></div></div></div>
<div id="voice"><div class="mic"><svg viewBox="0 0 24 24"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V5a3.5 3.5 0 1 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5zm6-3.5a6 6 0 0 1-12 0H4.2a7.8 7.8 0 0 0 6.9 7.7V21h1.8v-2.3a7.8 7.8 0 0 0 6.9-7.7z"/></svg></div><div class="txt dim"></div></div>
<script src="lglass.js"></script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
// browser preview (no Android bridge): demo tiles so the page can be looked at and recorded on a PC
const DEMO = [['com.netflix.ninja', 'Netflix'], ['com.google.android.youtube.tv', 'YouTube'], ['com.amazon.amazonvideo.livingroom', 'Prime Video'],
  ['com.disney.disneyplus', 'Disney+'], ['com.wbd.stream', 'Max'], ['com.spotify.tv.android', 'Spotify'], ['com.apple.atve.androidtv.appletv', 'Apple TV'],
  ['tv.twitch.android.app', 'Twitch'], ['org.videolan.vlc', 'VLC'], ['com.android.chrome', 'Chrome']].map(([pkg, label]) => ({pkg, label, banner: `demo/${label.replace(/\W/g, '').toLowerCase()}.svg`}));
const native = window.Android || {apps: () => JSON.stringify(DEMO), launch: p => console.log('launch', p), version: () => '1.0.0'};
const call = (f, ...a) => { try { return native[f] && native[f](...a); } catch (e) {} };
const ready = () => { document.documentElement.classList.remove('boot'); call('ready'); };
setTimeout(ready, 2500);                                             // safety: show whatever is there
const loadJ = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const saveJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const load = k => { const v = loadJ(k); return Array.isArray(v) ? v : null; };
const VERSION = call('version') || '1.0.0', REPO = 'jakubvavradev/agentic-tv';

/* ---------- preferences: what the user picked, else derived from where the TV is (IP location) ----------
   Language, dock preset, °C/°F and 12/24 h follow the country until the user changes them in the preferences sheet. */
let LOC = loadJ('loc');                                              // {lat, lon, cc, city, t}
const PREF = Object.assign({}, loadJ('prefs'));
const LANGS = ['cs', 'sk', 'en', 'de', 'pl', 'fr', 'es', 'it'];
const LANG_OF = {US: 'en', GB: 'en', IE: 'en', CA: 'en', AU: 'en', NZ: 'en', CZ: 'cs', SK: 'sk', DE: 'de', AT: 'de', CH: 'de', LI: 'de', PL: 'pl', FR: 'fr', BE: 'fr', LU: 'fr', MC: 'fr', IT: 'it', SM: 'it',
  ES: 'es', MX: 'es', AR: 'es', CO: 'es', CL: 'es', PE: 'es', VE: 'es', EC: 'es', GT: 'es', CU: 'es', BO: 'es', DO: 'es', HN: 'es', PY: 'es', SV: 'es', NI: 'es', CR: 'es', PA: 'es', UY: 'es'};
const H12 = new Set(['US', 'CA', 'AU', 'NZ', 'IN', 'PH', 'PK', 'BD', 'EG', 'SA']), FAHR = new Set(['US', 'LR', 'MM', 'BS', 'BZ', 'KY', 'PW']);
const AUTO = {
  lang: () => (LOC && LANG_OF[LOC.cc]) || LANGS.find(l => (navigator.language || '').toLowerCase().startsWith(l)) || 'en',
  region: () => (LOC ? LOC.cc === 'CZ' : get('lang') === 'cs') ? 'cz' : 'intl',
  temp: () => LOC && FAHR.has(LOC.cc) ? 'f' : 'c',
  clock: () => LOC && H12.has(LOC.cc) ? '12' : '24',
  fx: () => 'full',
};
function get(k) { return PREF[k] ?? AUTO[k](); }
// first five = the shelf. Only installed apps show, so a preset may name apps the TV does not have.
const PRESETS = {
  cz: ['com.netflix.ninja', 'net.cme.voyo.cz.tvapp', 'com.google.android.youtube.tv', 'cz.prima.tvapp', 'org.videolan.vlc', 'cz.ceskatelevize.ivysilani.tvapp'],
  intl: ['com.netflix.ninja', 'com.google.android.youtube.tv', 'com.amazon.amazonvideo.livingroom', 'com.disney.disneyplus', 'com.wbd.stream', 'com.spotify.tv.android'],
};

/* ---------- texts ---------- */
const STR = {
  settings: ['Nastavení', 'Nastavenia', 'Settings', 'Einstellungen', 'Ustawienia', 'Réglages', 'Ajustes', 'Impostazioni'],
  prefs: ['Předvolby', 'Predvoľby', 'Preferences', 'Optionen', 'Preferencje', 'Préférences', 'Preferencias', 'Preferenze'],
  welcome: ['Vítejte', 'Vitajte', 'Welcome', 'Willkommen', 'Witamy', 'Bienvenue', 'Bienvenido', 'Benvenuto'],
  byLoc: ['nastaveno podle polohy', 'nastavené podľa polohy', 'set up for your location', 'an deinen Standort angepasst', 'dopasowane do lokalizacji', 'réglé selon votre position', 'ajustado a tu ubicación', 'impostato in base alla posizione'],

async function locate() {

      try { const r = pick(await (await fetch(url)).json()); if (r && isFinite(r.lat) && isFinite(r.lon)) { LOC = Object.assign(r, {t: Date.now()}); saveJ('loc', LOC); break; } } catch (e) {}

/* ---------- weather: Open-Meteo (free, worldwide, no key) for the TV's location, every 10 min ---------- */

async function getWeather() {

}

  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return ['rain', code >= 95 || [65, 67, 82].includes(code) ? 1 : [55, 63, 66, 81].includes(code) ? .6 : .3];

  if (forced) weatherScene(forced, +(q.get('amt') || .6));

/* ---------- glass alignment: each panel's backdrop lines up with the wallpaper behind it ---------- */
function alignGlass() {
  for (const g of document.querySelectorAll('.glass')) {
    const r = g.getBoundingClientRect();
    g.style.backgroundPosition = `0 0,0 0,${-r.left}px ${-r.top}px`;

  const top = $('clock').offsetTop;
  $('clock').style.backgroundPosition = `0 0,${-0.04 * innerWidth}px ${(-top - 0.04 * innerHeight) / 1.22}px`;

let APPS = [], appsJson = '', LIST = [], ROWS = [[]], r = 0, c = 0, mode = 'home', topI = 1;   // mode: home | edit | top | panel; topI: 0 prefs, 1 settings

  const i = (p.opts.indexOf(get(p.k)) + step + p.opts.length) % p.opts.length;
  PREF[p.k] = p.opts[i]; saveJ('prefs', PREF);
  if (p.k === 'region') { order = PRESETS[PREF.region].concat((order || []).filter(x => !PRESETS[PREF.region].includes(x))); saveOrder(); appsJson = ''; loadApps(); }
  applyPrefs(); renderPanel();
}
function panelOk() {
  const p = PROWS[pi];
  if (p.k === 'clockLayout') { beginClockLayoutEdit(); return; }
  if (p.k === 'done') closePanel();
  else if (p.k === 'update') upd.state === 'avail' ? installUpdate() : checkUpdate(true);
  else cycle(1);
}
// language, units, clock and effects take effect at once
function applyPrefs() {
  const lang = get('lang');
  document.documentElement.lang = lang;
  call('setLang', VOICE_TAG[lang]);
  $('gear').querySelector('.cap').textContent = T('settings');
  $('opts').querySelector('.cap').textContent = T('prefs');
  if (!load('order')) { order = null; appsJson = ''; loadApps(); }     // nothing arranged by hand yet: follow the country
  setGL(); sceneKey = ''; showWeather(); renderPanel();
}

/* ---------- updates: newest GitHub release; the APK is installed by Android's own installer (the user confirms) ---------- */
let upd = {state: 'idle'};
const newer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); return false; };
async function checkUpdate(manual) {
  if (upd.state === 'checking' || upd.state === 'downloading') return;
  upd = {state: 'checking'}; renderPanel();
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
    if (!res.ok) throw res.status;
    const j = await res.json();
    const v = String(j.tag_name || '').replace(/^v/, ''), apk = (j.assets || []).find(a => /\.apk$/.test(a.name));
    upd = v && apk && newer(v, VERSION) ? {state: 'avail', v, url: apk.browser_download_url} : {state: 'latest'};
  } catch (e) { upd = {state: manual ? 'fail' : 'idle'}; }
  saveJ('updAt', Date.now());
  $('opts').classList.toggle('dot', upd.state === 'avail');
  renderPanel();
}
function installUpdate() {
  if (!native.install) { upd.state = 'fail'; return renderPanel(); }
  upd.state = 'downloading'; renderPanel(); call('install', upd.url);
}
window.onUpdate = s => { upd.state = s === 'ok' ? 'latest' : s; renderPanel(); };   // native: downloading | fail | ok
function hold() {                       // long OK on any app: pick it up and move it anywhere (shelf = first row)
  if (mode === 'home' && current()) setMode('edit');
}
function moveApp(step) {                // ← → by one place, ↑ ↓ by one row, across shelf and grid
  const i = r * PER + c, j = Math.max(0, Math.min(LIST.length - 1, i + step));
  if (j === i) return;
  const [a] = LIST.splice(i, 1); LIST.splice(j, 0, a);
  order = LIST.map(x => x.pkg);
  r = Math.floor(j / PER); c = j % PER;
  layout();
}

/* ---------- Czech voice commands ----------
   "otevři Netflix" · "pusť Wednesday na Netflixu" · "najdi Stranger Things na YouTube" · anything else goes to Google Assistant */
const fold = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9+ ]/g, ' ').replace(/\s+/g, ' ').trim();
// spoken names (folded, incl. Czech case endings) -> package; English name for the Assistant; how to open a title inside the app
const VAPPS = [
  {pkg: 'com.netflix.ninja', say: ['netflix', 'netflixu', 'netflixe', 'netflixem'], en: 'Netflix'},
  {pkg: 'com.google.android.youtube.tv', say: ['youtube', 'youtubu', 'youtubem', 'jutub', 'jutube', 'you tube', 'jutubu'], en: 'YouTube',
   url: q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q)},
  {pkg: 'com.google.android.youtube.tvmusic', say: ['youtube music', 'youtube hudba', 'hudbu', 'muziku'], en: 'YouTube Music'},
  {pkg: 'com.amazon.amazonvideo.livingroom', say: ['prime video', 'prime', 'amazon', 'amazonu', 'primu video'], en: 'Prime Video'},
  {pkg: 'com.disney.disneyplus', say: ['disney plus', 'disney', 'disneyho', 'disneyi', 'disney+'], en: 'Disney+'},
  {pkg: 'cz.ceskatelevize.ivysilani.tvapp', say: ['ivysilani', 'i vysilani', 'ceska televize', 'ceskou televizi', 'ceske televizi', 'ct', 'cetecko', 'ceteckem']},
  {pkg: 'net.cme.voyo.cz.tvapp', say: ['oneplay', 'one play', 'van plej', 'vanplej', 'voyo', 'vojo', 'nova', 'novu']},
  {pkg: 'cz.prima.tvapp', say: ['prima plus', 'prima+', 'primu plus', 'prima', 'primu', 'prime plus', 'iprima']},
  {pkg: 'org.videolan.vlc', say: ['vlc', 've el ce', 'vlcko']},
  {pkg: 'org.xbmc.kodi', say: ['kodi', 'kody', 'kodiho']},
  {pkg: 'com.stayfprod.awesomeradio.free', say: ['radio', 'radia', 'radio online', 'radiu']},
  {pkg: 'com.android.vending', say: ['obchod play', 'obchod', 'google play', 'play store']},
  {pkg: 'com.joxdev.orbia', say: ['orbia', 'orbiu']},
  {pkg: SETTINGS, say: ['nastaveni']},
];
function findApp(t) {                                   // longest spoken name contained in t (as whole words)
  let best = null, len = 0;
  for (const a of VAPPS) for (const n of a.say) {
    if (n.length > len && (' ' + t + ' ').includes(' ' + n + ' ')) { best = a; len = n.length; }
  }
  if (!best) for (const a of APPS) { const n = fold(a.label); if (n.length > len && (' ' + t + ' ').includes(' ' + n + ' ')) { best = {pkg: a.pkg, say: [n]}; len = n.length; } }
  return best && (best.pkg === SETTINGS || APPS.some(x => x.pkg === best.pkg)) ? best : null;
}
const OPEN = /^(otevri|otevrit|otevres|spust|spustit|zapni|zapnout|jdi na|jdi do|prepni na|prepni do|ukaz|chci)\s+(.*)$/;
const PLAY = /^(pust|pustit|pust mi|prehraj|prehrat|zahraj|spust|dej|dej mi|chci videt|chci koukat na|najdi|vyhledej|hledej|hledat|najit)\s+(.+)$/;
function command(raw) {                                  // -> {say: what we show, run: () => void}
  const t = fold(raw);
  if (!t) return null;
  if (get('lang') !== 'cs') return {say: raw, run: () => native.assistant(raw)};   // Czech grammar below; other languages go straight to the Assistant
  // "<verb> <title> na/v/ve <app>"
  const m = t.match(PLAY);
  if (m) {
    const rest = m[2], cut = rest.match(/^(.*?)\s+(na|v|ve|pres|z)\s+(.+)$/);
    const app = cut && findApp(cut[3]);
    if (cut && app && cut[1]) {
      const title = raw.split(/\s+/).slice(m[1].split(' ').length, m[1].split(' ').length + cut[1].split(' ').length).join(' ');
      if (app.url) return {say: `${app.en || ''} · ${title}`, run: () => native.openIn(app.pkg, app.url(title))};
      if (app.en) return {say: `${app.en} · ${title}`, run: () => native.assistant(`play ${title} on ${app.en}`)};
      return {say: label(app.pkg), run: () => native.launch(app.pkg)};       // no deep link known: at least open the app
    }
    const only = findApp(rest);
    if (only && fold(rest).split(' ').length <= only.say[0].split(' ').length + 1) return {say: label(only.pkg), run: () => native.launch(only.pkg)};
    if (/^(pust|pustit|pust mi|prehraj|prehrat|zahraj|dej|dej mi|chci videt)$/.test(m[1]))
      return {say: raw, run: () => native.assistant('play ' + raw.split(/\s+/).slice(m[1].split(' ').length).join(' '))};
  }
  const o = t.match(OPEN), app = findApp(o ? o[2] : t);
  if (app && (o || t.split(' ').length <= 3)) return {say: label(app.pkg), run: () => app.pkg === SETTINGS ? native.launch(SETTINGS) : native.launch(app.pkg)};
  return {say: raw, run: () => native.assistant(raw)};                       // everything else: Google Assistant
}
const label = pkg => pkg === SETTINGS ? T('settings') : (APPS.find(a => a.pkg === pkg) || {}).label || '';
let voiceT = 0;
function voiceUI(text, dim, state) {
  const b = document.body;
  clearTimeout(voiceT);
  b.classList.toggle('voice', !!state); b.classList.toggle('listening', state === 'listen');
  const el = $('voice').querySelector('.txt'); el.textContent = text; el.classList.toggle('dim', !!dim);
}
window.onVoice = (kind, text) => {
  if (kind === 'start' || kind === 'listen') voiceUI(T('listen'), true, 'listen');
  else if (kind === 'partial') { if (text) voiceUI(text, false, 'listen'); }
  else if (kind === 'thinking') voiceUI($('voice').querySelector('.txt').textContent, false, 'think');
  else if (kind === 'final') {
    const c = command(text);
    if (!c) { voiceUI(T('nope'), true, 'think'); voiceT = setTimeout(() => voiceUI('', true, null), 1400); return; }
    voiceUI(c.say || text, false, 'think');
    setTimeout(c.run, 350);
    voiceT = setTimeout(() => voiceUI('', true, null), 1600);
  } else if (kind === 'error') {
    voiceUI(T(text === '7' ? 'nope' : 'mic'), true, 'think');
    voiceT = setTimeout(() => voiceUI('', true, null), 1400);
  } else voiceUI('', true, null);
};
// preview / testing hook: ?say=... runs a command as if spoken
if (q.has('say')) setTimeout(() => onVoice('final', q.get('say')), 1500);

/* ---------- remote: OK acts on release; holding it ≥ 550 ms is a long press ---------- */
let holdT = 0, held = false, okDown = false;
addEventListener('keydown', e => {
  const k = e.key;
  if (mode === 'clockLayout') {
    e.preventDefault();
    if (k === 'Escape' || k === 'Backspace') finishClockLayoutEdit();
    else if (!e.repeat || k !== 'Enter') ClockLayout.key(k);
    return;
  }
  if (k === 'Enter') {
    e.preventDefault();
    if (e.repeat || okDown) {                                   // the remote auto-repeats a held key: that is a hold too
      if (okDown && !held) { clearTimeout(holdT); held = true; hold(); }
      return;
    }
    okDown = true; held = false;
    holdT = setTimeout(() => { held = true; hold(); }, 550);
    return;
  }
  if (mode === 'edit') {
    if (k === 'ArrowRight') moveApp(1);
    else if (k === 'ArrowLeft') moveApp(-1);
    else if (k === 'ArrowDown') moveApp(PER);
    else if (k === 'ArrowUp') moveApp(-PER);
    else if (k === 'Escape') { saveOrder(); setMode('home'); }
    else return;
  } else if (mode === 'panel') {
    if (k === 'ArrowDown') { pi = Math.min(PROWS.length - 1, pi + 1); renderPanel(); }
    else if (k === 'ArrowUp') { pi = Math.max(0, pi - 1); renderPanel(); }
    else if (k === 'ArrowRight') cycle(1);
    else if (k === 'ArrowLeft') cycle(-1);
    else if (k === 'Escape') closePanel();
    else return;
  } else if (mode === 'top') {
    if (k === 'ArrowLeft' && topI) { topI = 0; moveFocus(r, c); }
    else if (k === 'ArrowRight' && !topI) { topI = 1; moveFocus(r, c); }
    else if (k === 'ArrowDown' || k === 'Escape') setMode('home');
    else return;
  } else {
    if (k === 'ArrowRight') moveFocus(r, c + 1);
    else if (k === 'ArrowLeft') moveFocus(r, c - 1);
    else if (k === 'ArrowDown') moveFocus(r + 1, c);
    else if (k === 'ArrowUp') { if (r === 0) { topI = c < 2 ? 0 : 1; setMode('top'); } else moveFocus(r - 1, c); }
    else if (k === 'Escape') moveFocus(0, c);
    else return;
  }
  e.preventDefault();
});
addEventListener('keyup', e => {
  if (e.key !== 'Enter' || !okDown) return;
  okDown = false; clearTimeout(holdT);
  if (!held) press();
  e.preventDefault();
});
// called by the native side
const toHome = col => { if (mode === 'edit') saveOrder(); mode = 'home'; document.body.classList.remove('edit'); moveFocus(0, col); };
window.onBack = () => mode === 'clockLayout' ? finishClockLayoutEdit() : mode === 'panel' ? closePanel() : toHome(c);
window.onHome = () => { if (mode === 'panel') closePanel(); toHome(0); };
window.onResumeHome = () => { okDown = false; clearTimeout(holdT); tick(true); loadApps(); };

addEventListener('resize', () => { alignGlass(); paintClock(); paintPanels(); });
ClockLayout.init(paintClock); applyPrefs(); tick(); loadApps(); showWeather();
setInterval(tick, 5000);
locate(); setInterval(getWeather, 10 * 60 * 1000); setInterval(locate, 6 * 3600 * 1000);
if (Date.now() - (loadJ('updAt') || 0) > 864e5) setTimeout(checkUpdate, 20000);   // quietly, once a day: a red dot on Preferences
if (firstRun) setTimeout(() => { if (mode === 'home') openPanel(); }, 2800);        // first start: the sheet comes up by itself
</script>
</body>
</html>
